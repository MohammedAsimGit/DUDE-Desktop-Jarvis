[package]
name = "dude"
version = "0.1.0"
description = "Dude — native Windows desktop AI assistant (Phase 0 foundation)"
edition = "2021"

# The lib gets a distinct name so the `dude` binary and lib don't clash on Windows.
[lib]
name = "dude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
